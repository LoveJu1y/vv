# ============================================================================
# Libero-goal (LeRobot) :: ECoT Training (Single Config)
# ============================================================================
# Reference configs:
# - starVLA/config/training/bridge_lerobot_stage2.yaml  (ECoT training scaffold)
# - starVLA/config/training/starvla_cotrain_libero.yaml (Libero horizons / dims)
#
# Key behavior in train_ecot.py:
# - When framework.training_stage == "full", train_ecot derives stage from framework.cot_mode.
#   For cot_mode=implicit, it will overwrite datasets.vla_data.bridge_reasoning.stage to 4.
# - When training_stage in ("reasoning_only","action_only"), it will NOT overwrite stage.
#
# This file is intended to be the single source of truth:
# - Default: full + implicit => Stage-4
# - If you want other modes, use CLI overrides (no need to maintain extra YAML files), e.g.:
#   - reasoning_only stage-1:
#       --framework.training_stage reasoning_only --datasets.vla_data.bridge_reasoning.stage 1 --datasets.vla_data.ecot.scheduled_stage 1
#   - action_only stage-1 (stage is ignored for action-only, but keep it consistent):
#       --framework.training_stage action_only --datasets.vla_data.bridge_reasoning.stage 1 --datasets.vla_data.ecot.scheduled_stage 1
#
# Libero horizon alignment:
# - action_indices length = 8  => future_action_window_size=7, action_horizon=8
# ============================================================================

run_id: "libero_goal_ecot_stage4"
run_root_dir: "results/LiberoECOT"
seed: 42
trackers: [jsonl, wandb]
wandb_entity: "your_wandb_entity"
wandb_project: "libero_ecot"
is_debug: false

datasets:
  vla_data:
    dataset_py: "lerobot_datasets"
    data_root_dir: "/share/project/baishuanghao/data/libero_lerobot"
    data_mix: "libero_goal"
    per_device_batch_size: 8
    image_size: [224, 224]
    delete_pause_frame: true
    obs: ["image_0"]
    default_image_resolution: [3, 224, 224]

    bridge_annotations:
      cot_path: "annotations/episode_dense_captions_full.jsonl"
      bbox_path: "annotations/episode_sam3_bboxes_from_dino_final.jsonl"
      fast_tokenizer_name: "physical-intelligence/fast"
      steps_cache_path: "/share/project/lvjing/starVLA/results/Debug/steps_cache/libero_goal_steps.pkl"
      write_steps_cache: false
      filters:
        require_cot_episode: false
        require_bbox_episode: true
        min_episode_bbox_coverage: 0.0
        require_bbox_step: false
        include_task_indices: null
        exclude_task_indices: null

    bridge_reasoning:
      enable: true
      stage: 4  # for full+implicit this will be enforced by train_ecot anyway
      include_bbox: true
      include_action_tokens: false
      include_img_next: true
      thinking_token: "<|thinking|>"
      start_token: "<|start_of_thinking|>"
      end_token: "<|end_of_thinking|>"
      component_order: [SUBTASK, BBOX, REASON]
      tag2think_count:
        SUBTASK: 1
        REASON: 1
        BBOX: 1
      vlm_loss_weight: 1

    ecot:
      scheduled_stage: 4

framework:
  name: "QwenGR00T"
  training_stage: "full"
  cot_mode: "implicit"          # stage will be overwritten to 4 by train_ecot.py

  img_next:
    enable: true
    token: "<img_next>"
    loss_weight: 0.1
    res: 112
    use_teacher: true

  qwenvl:
    base_vlm: "StarVLA/Qwen3-VL-4B-Instruct-Action"
    attn_implementation: "sdpa"
    cache_dir: "./qwen_cache"
    model_max_length: 2048

  action_model:
    action_model_type: "DiT-B"
    hidden_size: 1024
    add_pos_embed: true
    max_seq_len: 1024
    action_dim: 7
    state_dim: 7
    future_action_window_size: 7
    action_horizon: 8
    past_action_window_size: 0
    repeated_diffusion_steps: 4
    noise_beta_alpha: 1.5
    noise_beta_beta: 1.0
    noise_s: 0.999
    num_timestep_buckets: 1000
    num_inference_timesteps: 4
    num_target_vision_tokens: 32
    diffusion_model_cfg:
      cross_attention_dim: 1536
      dropout: 0.2
      final_dropout: true
      interleave_self_attention: true
      norm_type: "ada_norm"
      num_layers: 16
      output_dim: 1024
      positional_embeddings: null

trainer:
  max_train_steps: 60000
  epochs: null
  gradient_accumulation_steps: 1
  gradient_clipping: 1.0
  logging_frequency: 10
  save_interval: 5000
  eval_interval: 2000
  warmup_ratio: 0.1
  num_warmup_steps: 5000
  learning_rate:
    base: 3.0e-5
    qwen_vl_interface: 1.0e-5
    action_model: 1.0e-4
  lr_scheduler_type: "cosine_with_min_lr"
  scheduler_specific_kwargs:
    min_lr: 5.0e-7
  optimizer:
    name: "AdamW"
    betas: [0.9, 0.95]
    eps: 1.0e-8
    weight_decay: 1.0e-8
  freeze_modules: ""
  enable_gradient_checkpointing: false
  enable_mixed_precision_training: true
